<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Table - Chaitanya Food Court</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Adjusted form styling */
    .reservation {
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .reservation-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .reservation-card h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    form label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    form input {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.4rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .button-container {
      text-align: center;
      margin-top: 2rem;
    }

    .btn {
      font-size: 1.1rem;
      padding: 0.8rem 2rem;
      background: #0077cc;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Chaitanya Food Court</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="order.html">Order Online</a>
      <a href="reservation.html" class="active">Book a Table</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Hero section styled like index.html -->
  <section class="hero">
    <h1>Reserve Your Table</h1>
    <p>Enjoy a seamless dining experience by booking your table in advance.</p>
  </section>

  <!-- Reservation form -->
  <section class="reservation">
    <div class="reservation-card">
      <h2>Table Reservation Form</h2>
      <form action="booking-success.html" method="get">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" required />

        <label for="date">Date</label>
        <input type="date" id="date" name="date" required />

        <label for="time">Time</label>
        <input type="time" id="time" name="time" required />

        <label for="guests">Number of Guests</label>
        <input type="number" id="guests" name="guests" min="1" max="20" required />

        <div class="button-container">
          <button type="submit" class="btn">Book Now</button>
        </div>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Chaitanya Food Court. All rights reserved.</p>
  </footer>
</body>
</html>
